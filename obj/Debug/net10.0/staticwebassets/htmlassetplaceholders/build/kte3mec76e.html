<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
<script>
    // بيانات الربط (Config)
    const firebaseConfig = { 
        databaseURL: "https://nawafappointments-default-rtdb.firebaseio.com/"
    };
    
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    // دالة الحفظ (تتعامل مع الإضافة والتعديل بشكل صحيح بناءً على وجود الـ id)
    window.saveToFirebase = (appointment) => {
        if (appointment.id) {
            // إذا كان له ID، نقوم بتحديث الموعد الحالي نفسه
            return db.ref('appointments/' + appointment.id).set(appointment);
        } else {
            // إذا لم يكن له ID، نقوم بإضافة موعد جديد
            const newRef = db.ref('appointments').push();
            appointment.id = newRef.key; // حفظ الـ Key الجديد داخل الكائن
            return newRef.set(appointment);
        }
    };

    // دالة الحذف
    window.deleteFromFirebase = (id) => {
        return db.ref('appointments/' + id).remove();
    };

    // دالة الجلب الصحيحة (تم حذف التكرار وضمان دمج الـ ID مع البيانات)
window.loadFromFirebase = async () => { 
    const snapshot = await db.ref('appointments').once('value');
    const data = snapshot.val();
    if (!data) return [];

    const today = new Date();
    today.setHours(0, 0, 0, 0); // تجاهل الوقت

    const appointmentsList = Object.keys(data)
        .map(key => ({
            ...data[key],
            id: key
        }))
        .filter(item => {
            if (!item.date) return false;

            const appointmentDate = new Date(item.date);
            appointmentDate.setHours(0, 0, 0, 0);

            return appointmentDate >= today;
        });
       

    return appointmentsList.sort((a, b) =>
        new Date(a.date) - new Date(b.date)
    );
};
</script>
